<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="rbBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B0A14" />
      <stop offset="70%" stop-color="#1A050A" />
      <stop offset="100%" stop-color="#0D0205" />
    </radialGradient>
    <linearGradient id="rbGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="25%" stop-color="#F3C64F" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#6E4A0C" />
    </linearGradient>
    <linearGradient id="rbGoldLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5E2B3" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#FFF9E6" />
    </linearGradient>
    <linearGradient id="rbRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9A9E" />
      <stop offset="40%" stop-color="#E84A6E" />
      <stop offset="80%" stop-color="#8B1E3F" />
      <stop offset="100%" stop-color="#4A0E17" />
    </linearGradient>
    <filter id="rbGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Shield / Medallion -->
  <circle cx="60" cy="60" r="58" fill="url(#rbBg)" />
  
  <!-- Outer Beaded / Filigree Ring -->
  <circle cx="60" cy="60" r="56" fill="none" stroke="url(#rbGold)" stroke-width="2.5" />
  <circle cx="60" cy="60" r="52.5" fill="none" stroke="url(#rbGold)" stroke-width="0.8" stroke-dasharray="2, 2.5" opacity="0.85" />
  <circle cx="60" cy="60" r="49" fill="none" stroke="url(#rbGold)" stroke-width="1.2" />

  <!-- Botanical Laurel Wreath Leaves (Left & Right) -->
  <g fill="url(#rbGold)" opacity="0.95">
    <!-- Left Laurel -->
    <path d="M22 62 C20 54 26 48 30 50 C26 55 26 59 22 62 Z" />
    <path d="M24 50 C22 42 30 38 33 41 C30 46 29 49 24 50 Z" />
    <path d="M30 39 C30 31 38 29 40 33 C36 37 34 39 30 39 Z" />
    <path d="M39 31 C41 24 50 24 50 28 C46 31 43 32 39 31 Z" />
    
    <!-- Right Laurel -->
    <path d="M98 62 C100 54 94 48 90 50 C94 55 94 59 98 62 Z" />
    <path d="M96 50 C98 42 90 38 87 41 C90 46 91 49 96 50 Z" />
    <path d="M90 39 C90 31 82 29 80 33 C84 37 86 39 90 39 Z" />
    <path d="M81 31 C79 24 70 24 70 28 C74 31 77 32 81 31 Z" />

    <!-- Laurel Bottom Ribbon -->
    <path d="M54 92 C58 90 62 90 66 92 C63 94 57 94 54 92 Z" />
  </g>

  <!-- Crown / Top Blossom Accent -->
  <g fill="url(#rbGold)" filter="url(#rbGlow)">
    <circle cx="60" cy="22" r="3" />
    <path d="M60 16 L62 21 L67 22 L62 23 L60 28 L58 23 L53 22 L58 21 Z" />
    <circle cx="50" cy="24" r="1.5" />
    <circle cx="70" cy="24" r="1.5" />
  </g>

  <!-- Central Velvet Shield -->
  <path d="M60 30 C74 30 82 38 80 56 C78 72 60 84 60 84 C60 84 42 72 40 56 C38 38 46 30 60 30 Z" fill="url(#rbRose)" stroke="url(#rbGold)" stroke-width="1.8" />
  
  <!-- Inner Shield Filigree Contour -->
  <path d="M60 34 C71 34 77 41 76 55 C74 68 60 78 60 78 C60 78 46 68 44 55 C43 41 49 34 60 34 Z" fill="none" stroke="url(#rbGoldLight)" stroke-width="0.8" opacity="0.7" />

  <!-- Blooming Rose Petals Inside Shield Top -->
  <g fill="url(#rbGoldLight)">
    <path d="M60 38 C64 42 66 45 60 49 C54 45 56 42 60 38 Z" opacity="0.9" />
    <path d="M57 41 C54 44 55 48 60 48 C58 45 57 43 57 41 Z" opacity="0.75" />
    <path d="M63 41 C66 44 65 48 60 48 C62 45 63 43 63 41 Z" opacity="0.75" />
  </g>

  <!-- Interwoven Royal Monogram "RB" -->
  <g font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-weight="700" text-anchor="middle" fill="url(#rbGold)">
    <text x="59.5" y="67" font-size="21" letter-spacing="1" filter="url(#rbGlow)">RB</text>
  </g>

  <!-- Micro Star Accents -->
  <polygon points="60,86 61.5,89 64.5,89.5 62,91.5 63,94.5 60,93 57,94.5 58,91.5 55.5,89.5 58.5,89" fill="url(#rbGold)" />
  <circle cx="34" cy="64" r="1.2" fill="#FFF3B0" />
  <circle cx="86" cy="64" r="1.2" fill="#FFF3B0" />
</svg>